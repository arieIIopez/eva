name: Paper experiment RMC primary

on:
  workflow_dispatch:
  push:
    branches: [paper-rmc-eligible-2026-09-01]
    paths:
      - 'scripts/run-paper-experiment-rmc-primary.mjs'
      - '.github/workflows/paper-experiment-rmc-primary.yml'

permissions:
  contents: read

concurrency:
  group: eva-paper-rmc-primary
  cancel-in-progress: true

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8080 > /tmp/eva-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/experiments/runner-rmc-eligible.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/eva-http.log
          exit 1
      - name: Run primary RMC + C/I contrast
        env:
          EVA_EXPERIMENT_BASE_URL: http://127.0.0.1:8080/experiments/runner-rmc-eligible.html
        run: node scripts/run-paper-experiment-rmc-primary.mjs
