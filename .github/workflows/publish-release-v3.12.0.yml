name: Publica release EVA v3.12.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-release-v3.12.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear tag y release v3.12.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD^)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin refs/tags/v3.12.0 >/dev/null 2>&1; then
            echo "El tag v3.12.0 ya existe."
          else
            git tag -a v3.12.0 "$TARGET_SHA" -m "EVA v3.12.0"
            git push origin v3.12.0
          fi

          if gh release view v3.12.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release v3.12.0 ya existe."
          else
            gh release create v3.12.0 \
              --repo "$GITHUB_REPOSITORY" \
              --title "EVA v3.12.0" \
              --notes-file docs/RELEASE_v3.12.0.md \
              --verify-tag
          fi
