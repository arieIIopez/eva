name: Paper lookahead RMC30
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/paper-lookahead-rmc30.js'
      - 'experiments/runner-lookahead-rmc30.html'
      - 'scripts/run-paper-lookahead-rmc30.mjs'
      - '.github/workflows/paper-lookahead-rmc30.yml'
permissions:
  contents: read
concurrency:
  group: eva-paper-lookahead-rmc30
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8080 >/tmp/eva-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/experiments/runner-lookahead-rmc30.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - env:
          EVA_EXPERIMENT_BASE_URL: http://127.0.0.1:8080/experiments/runner-lookahead-rmc30.html
        run: node scripts/run-paper-lookahead-rmc30.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eva-paper-lookahead-rmc30
          path: results/paper-lookahead-rmc30/**
          retention-days: 30