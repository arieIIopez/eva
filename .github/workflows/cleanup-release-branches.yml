name: Limpia ramas temporales de release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-release-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Eliminar rama temporal restante y retirar este workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin refs/heads/v3.12.0 >/dev/null 2>&1; then
            git push origin :refs/heads/v3.12.0
          fi

          git rm .github/workflows/cleanup-release-branches.yml
          git commit -m "Retira workflow temporal de limpieza de release"
          git push origin HEAD:main
