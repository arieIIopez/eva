name: Paper experiments

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/**'
      - 'scripts/run-paper-experiments.mjs'
      - 'src/**'
      - 'data/**'
      - '.github/workflows/paper-experiments.yml'

permissions:
  contents: write

concurrency:
  group: eva-paper-experiments
  cancel-in-progress: true

jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 8080 > /tmp/eva-http.log 2>&1 &
          echo $! > /tmp/eva-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/experiments/runner.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/eva-http.log
          exit 1

      - name: Run reproducible paper experiments
        env:
          EVA_EXPERIMENT_BASE_URL: http://127.0.0.1:8080/experiments/runner.html
        run: node scripts/run-paper-experiments.mjs

      - name: Persist experiment outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/paper-experiments/
          if git diff --cached --quiet; then
            echo "No experiment output changes to commit"
          else
            git commit -m "Update corrected paper experiment outputs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eva-paper-experiments
          path: |
            results/paper-experiments/**
            /tmp/eva-http.log
          if-no-files-found: warn
          retention-days: 30
