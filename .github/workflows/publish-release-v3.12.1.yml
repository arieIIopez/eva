name: Publica release EVA v3.12.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-release-v3.12.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crear tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v3.12.1 HEAD^ -m "EVA v3.12.1"
          git push origin v3.12.1
      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.12.1
          name: EVA v3.12.1
          body_path: docs/RELEASE_v3.12.1.md
