name: Paper full portfolio scenarios

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/effective-network.js'
      - 'experiments/paper-full-portfolio-scenarios.js'
      - 'experiments/runner-full-portfolio-scenarios.html'
      - 'scripts/run-paper-full-portfolio-scenarios.mjs'
      - '.github/workflows/paper-full-portfolio-scenarios.yml'

permissions:
  contents: write

concurrency:
  group: eva-paper-full-portfolio-scenarios
  cancel-in-progress: true

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 8080 > /tmp/eva-http.log 2>&1 &
          echo $! > /tmp/eva-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/experiments/runner-full-portfolio-scenarios.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/eva-http.log
          exit 1

      - name: Run full portfolio scenario experiment
        env:
          EVA_EXPERIMENT_BASE_URL: http://127.0.0.1:8080/experiments/runner-full-portfolio-scenarios.html
        run: node scripts/run-paper-full-portfolio-scenarios.mjs

      - name: Publish reproducible outputs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add results/paper-full-portfolio-scenarios/
          if git diff --cached --quiet; then
            echo "No output changes to publish"
          else
            git commit -m "Update full portfolio scenario outputs"
            git push
          fi

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eva-paper-full-portfolio-scenarios
          path: |
            results/paper-full-portfolio-scenarios/**
            /tmp/eva-http.log
          if-no-files-found: warn
          retention-days: 30
