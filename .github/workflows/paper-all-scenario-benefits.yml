name: Paper all scenario benefits

on:
  workflow_dispatch:
  push:
    branches: [paper-all-scenario-benefits-2026-09-02]
    paths:
      - 'experiments/paper-all-scenario-benefits.js'
      - 'experiments/runner-all-scenario-benefits.html'
      - 'scripts/run-paper-all-scenario-benefits.mjs'
      - '.github/workflows/paper-all-scenario-benefits.yml'

permissions:
  contents: read

concurrency:
  group: eva-paper-all-scenario-benefits
  cancel-in-progress: true

jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - ponderacion_rmc
          - balanceado
          - equidad
          - demanda
          - ciclistas_biogeme
          - fractal_alameda
          - continuidad
          - eficiencia
          - educacion
          - integracion
          - seguridad
          - intermodal
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 8080 > /tmp/eva-http.log 2>&1 &
          echo $! > /tmp/eva-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/experiments/runner-all-scenario-benefits.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/eva-http.log
          exit 1

      - name: Run scenario benefit experiment
        env:
          EVA_EXPERIMENT_BASE_URL: http://127.0.0.1:8080/experiments/runner-all-scenario-benefits.html
          EVA_SCENARIO_KEY: ${{ matrix.scenario }}
        run: node scripts/run-paper-all-scenario-benefits.mjs

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eva-benefits-${{ matrix.scenario }}
          path: |
            results/paper-all-scenario-benefits/${{ matrix.scenario }}/**
            /tmp/eva-http.log
          if-no-files-found: warn
          retention-days: 30
