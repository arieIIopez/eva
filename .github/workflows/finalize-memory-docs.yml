name: Finalizar documentación de memoria

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-memory-docs.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enlazar memoria en README y CHANGELOG
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          txt = readme.read_text(encoding='utf-8')
          marker = "| Documento | Contenido |\n|---|---|\n"
          rows = (
              "| [`docs/MEMORIA_TECNICA_CIENTIFICA.md`](docs/MEMORIA_TECNICA_CIENTIFICA.md) | **Memoria técnica, metodológica y científica vigente de EVA v3.12.1** |\n"
              "| [`docs/EVA_Memoria_Tecnica_Metodologica_Cientifica_v3.12.1.pdf`](docs/EVA_Memoria_Tecnica_Metodologica_Cientifica_v3.12.1.pdf) | Versión PDF de la memoria científica, generada reproduciblemente desde el Markdown |\n"
              "| [`docs/METODO_DENDRITICO.md`](docs/METODO_DENDRITICO.md) | Formulación científica detallada del índice de conectividad dendrítica |\n"
          )
          if 'docs/MEMORIA_TECNICA_CIENTIFICA.md' not in txt:
              if marker not in txt:
                  raise SystemExit('No se encontró tabla de documentación en README')
              txt = txt.replace(marker, marker + rows, 1)
              readme.write_text(txt, encoding='utf-8')

          ch = Path('CHANGELOG.md')
          c = ch.read_text(encoding='utf-8')
          anchor = "- No introduce cambios en el motor de cálculo, los datos, el procesamiento ni la metodología respecto de la versión 3.12.0.\n"
          additions = (
              "- Publicación de `docs/MEMORIA_TECNICA_CIENTIFICA.md`, nueva memoria técnica, metodológica y científica alineada con el código vigente.\n"
              "- Publicación de `docs/METODO_DENDRITICO.md`, formulación científica del índice de conectividad dendrítica por distancia topológica a una red raíz.\n"
              "- Incorporación de un workflow reproducible para generar el PDF `docs/EVA_Memoria_Tecnica_Metodologica_Cientifica_v3.12.1.pdf` desde la fuente Markdown.\n"
          )
          if 'Publicación de `docs/MEMORIA_TECNICA_CIENTIFICA.md`' not in c:
              if anchor not in c:
                  raise SystemExit('No se encontró ancla v3.12.1 en CHANGELOG')
              c = c.replace(anchor, anchor + additions, 1)
              ch.write_text(c, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'Sin cambios.'
          else
            git commit -m 'Enlazar memoria técnica científica en documentación'
            git push
          fi
