<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EVA · runner experimental</title>
</head>
<body>
  <pre id="status">Inicializando runner experimental…</pre>
  <script>
    window.evaLog = function(level, message) {
      if (level === 'err' || level === 'warn') console.log(`[${level}] ${message}`);
    };
    window.evaYield = () => new Promise(resolve => setTimeout(resolve, 0));

    async function evalScript(path) {
      const response = await fetch(path);
      if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
      const code = await response.text();
      (0, eval)(`${code}\n//# sourceURL=${path}`);
    }

    (async function boot() {
      try {
        const scripts = [
          '../src/version.jsx',
          '../src/scenarios.jsx',
          '../src/demanda-modal.jsx',
          '../src/data.jsx',
          '../src/engine.jsx',
          '../src/fractal.js',
          '../src/dendritic-config.js',
          './paper-experiments.js'
        ];
        for (const path of scripts) await evalScript(path);
        await window.loadProjects();
        window.__EVA_EXPERIMENT_READY = true;
        document.getElementById('status').textContent = `Listo · ${(window.projectsFC && window.projectsFC.features || []).length} proyectos · ${(window.existingFC && window.existingFC.features || []).length} ejes existentes`;
      } catch (error) {
        window.__EVA_EXPERIMENT_ERROR = String(error && error.stack || error);
        document.getElementById('status').textContent = window.__EVA_EXPERIMENT_ERROR;
        console.error(error);
      }
    })();
  </script>
</body>
</html>
